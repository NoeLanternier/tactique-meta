# Met à jour 4 fois par jour meta.json (parties classées Master+), meta-gold.json (Or à Émeraude)
# et les métas des autres postes, à partir de l'API officielle de Riot.
name: Mettre à jour la méta

on:
  schedule:
    # Toutes les 6 heures : 04h17, 10h17, 16h17 et 22h17 UTC (+1 h à Paris en hiver, +2 h en été).
    # Chaque exécution collecte 5 heures : la clé est utilisée environ 20 heures par jour.
    - cron: '17 4,10,16,22 * * *'
  # Bouton « Run workflow » dans l'onglet Actions pour lancer à la main.
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Durée de collecte en minutes'
        required: false
        default: '300'

permissions:
  contents: write

# Une seule exécution à la fois : les suivantes attendent leur tour.
concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Limite de GitHub : 6 heures par exécution.
    timeout-minutes: 340
    steps:
      # On part de la DERNIÈRE version de main au moment où l'exécution démarre (et non de celle
      # du moment où elle a été déclenchée), pour récupérer le travail d'une exécution précédente.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Les compteurs du patch (dossier state/) vivent sur la branche « data », réécrite à chaque
      # exécution : ils ne s'accumulent pas jour après jour dans l'historique de main.
      # Tant que cette branche n'existe pas, on reprend le dossier state/ de main.
      - name: Reprise de l'état
        run: |
          if git fetch -q --depth=1 origin data; then
            rm -rf state
            git checkout FETCH_HEAD -- state
            git reset -q -- state
            echo "État repris de la branche data."
          else
            echo "Pas encore de branche data : état de main."
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Collecte des parties et calcul des builds
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '300' }}
          REGIONS: ${{ vars.REGIONS || 'euw1,kr,na1,sg2' }}
          # Variable GOLD_REGIONS : régions de la méta Or à Émeraude (« none » pour la désactiver).
          GOLD_REGIONS: ${{ vars.GOLD_REGIONS == 'none' && ' ' || vars.GOLD_REGIONS || 'euw1,na1' }}
          # Variable ROLES : postes collectés (tous par défaut).
          ROLES: ${{ vars.ROLES || 'top,jungle,mid,bot,support' }}
          # Cinq postes et deux niveaux en mémoire : on laisse plus de place à Node.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node src/run.mjs

      - name: Sauvegarde de l'état (branche data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          cp -r state "$tmp/"
          cd "$tmp"
          git init -q -b data
          git add -A
          git -c user.name="tactique-meta-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "État du $(date -u '+%Y-%m-%d %Hh')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - name: Publication des métas
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "tactique-meta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/ n'est plus suivi sur main (il est sur la branche data).
          git rm -r -q --cached --ignore-unmatch state
          # meta.json (jungle Master+), meta-top.json…, meta-gold.json, meta-gold-top.json…
          git add -A -- 'meta*.json'
          if [ -f .gitignore ]; then git add .gitignore; fi
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Méta du $(date -u '+%Y-%m-%d %Hh') UTC"
          # Si main a bougé entre-temps, on se replace dessus en gardant les nouvelles données.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin "$BRANCH"
          done
          echo "Échec de la publication après 3 essais." && exit 1
