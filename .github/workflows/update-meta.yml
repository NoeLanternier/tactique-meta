# Met à jour meta.json chaque jour à partir des parties classées Master+ (API officielle Riot).
name: Mettre à jour la méta

on:
  schedule:
    # Tous les jours à 04h17 UTC (05h17 heure de Paris en hiver, 06h17 en été).
    - cron: '17 4 * * *'
  # Bouton « Run workflow » dans l'onglet Actions pour lancer à la main.
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Durée de collecte en minutes'
        required: false
        default: '90'

permissions:
  contents: write

# Une seule exécution à la fois : les suivantes attendent leur tour.
concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # On part de la DERNIÈRE version de main au moment où l'exécution démarre (et non de celle
      # du moment où elle a été déclenchée), pour récupérer le travail d'une exécution précédente.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Collecte des parties et calcul des builds
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '90' }}
          REGIONS: ${{ vars.REGIONS || 'euw1,kr,na1' }}
        run: node src/run.mjs

      - name: Publication de meta.json
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "tactique-meta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A meta.json state
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Méta du $(date -u +%Y-%m-%d)"
          # Si main a bougé entre-temps, on se replace dessus en gardant les nouvelles données.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin "$BRANCH"
          done
          echo "Échec de la publication après 3 essais." && exit 1
