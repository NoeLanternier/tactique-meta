# Met à jour meta.json chaque jour à partir des parties classées Master+ (API officielle Riot).
name: Mettre à jour la méta

on:
  schedule:
    # Tous les jours à 04h17 UTC (05h17 heure de Paris en hiver, 06h17 en été).
    - cron: '17 4 * * *'
  # Bouton « Run workflow » dans l'onglet Actions pour lancer à la main.
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Durée de collecte en minutes'
        required: false
        default: '180'

permissions:
  contents: write

# Une seule exécution à la fois : les suivantes attendent leur tour.
concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # On part de la DERNIÈRE version de main au moment où l'exécution démarre (et non de celle
      # du moment où elle a été déclenchée), pour récupérer le travail d'une exécution précédente.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Les compteurs du patch (dossier state/) vivent sur la branche « data », réécrite à chaque
      # exécution : ils ne s'accumulent pas jour après jour dans l'historique de main.
      # Tant que cette branche n'existe pas, on reprend le dossier state/ de main.
      - name: Reprise de l'état
        run: |
          if git fetch -q --depth=1 origin data; then
            rm -rf state
            git checkout FETCH_HEAD -- state
            git reset -q -- state
            echo "État repris de la branche data."
          else
            echo "Pas encore de branche data : état de main."
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Collecte des parties et calcul des builds
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '180' }}
          REGIONS: ${{ vars.REGIONS || 'euw1,kr,na1,sg2' }}
        run: node src/run.mjs

      - name: Sauvegarde de l'état (branche data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          cp -r state "$tmp/"
          cd "$tmp"
          git init -q -b data
          git add -A
          git -c user.name="tactique-meta-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "État du $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - name: Publication de meta.json
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "tactique-meta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/ n'est plus suivi sur main (il est sur la branche data).
          git rm -r -q --cached --ignore-unmatch state
          git add -A meta.json
          if [ -f .gitignore ]; then git add .gitignore; fi
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Méta du $(date -u +%Y-%m-%d)"
          # Si main a bougé entre-temps, on se replace dessus en gardant les nouvelles données.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin "$BRANCH"
          done
          echo "Échec de la publication après 3 essais." && exit 1
